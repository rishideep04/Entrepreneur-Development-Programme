{% extends "layoutuser.html" %}

{% block head %}
    {{ super() }}
    <style>
        /* Add your CSS styles here */
        h3 {
            color: #333; /* Change the color of the h3 heading */
            text-align: center; /* Center-align the h3 heading */
        }

        table {
            width: 80%; /* Adjust the width of the table */
            margin: 20px auto; /* Center-align the table */
            border-collapse: collapse; /* Collapse borders between table cells */
        }

        th, td {
            padding: 12px; /* Add padding to table header and data cells */
            text-align: left; /* Align text to the left within cells */
        }

        th {
            background-color: #f2f2f2; /* Set background color for table header */
        }

        tr:nth-child(even) {
            background-color: #f9f9f9; /* Set background color for even rows */
        }
    </style>
{% endblock %}

{% block body %}
    <h3>Schedule for {{ coursename }}</h3>
    <table id="example" class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody>
            {% for row in schedule %}
                <tr>
                    <td>{{ row[1].strftime('%d - %B %Y') }}</td>
                    <td>{{ row[2].strftime('%I:%M %p') }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
