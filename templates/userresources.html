{% extends "layoutuser.html" %}

{% block head %}
    {{ super() }}
    <style>
        /* Add your custom styles here */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
{% endblock %}

{% block body %}
    <h3>Resource for {{coursename}}</h3>
    <table id="example" class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Resource Name</th>
            <th>Resource Link</th>
        </tr>
        </thead>
        <tbody>
        {% for row in resources %}
        <tr>
            <td>{{row[1]}}</td>
            <td><a href="{{row[0]}}">{{row[0]}}</a></td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
{% endblock %}
